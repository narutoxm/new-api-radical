<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>DogChat</title>
  <!-- 复古纸张质感底色 -->
  <rect width="32" height="32" rx="6" fill="#EAE5D9"/>

  <!-- 小狗侧影 / 聊天气泡主体 (挪威森林绿) -->
  <path d="M 11 25
           C 11 16, 12 14, 14 11
           L 16 5
           L 19 10
           C 22 10, 24 11, 26 13
           L 28 13
           A 1 1 0 0 1 29 14
           L 29 15
           A 1 1 0 0 1 28 16
           L 24 18
           L 22 25
           Z"
        fill="#2C4033" stroke-linejoin="round"/>

  <!-- 聊天气泡的尾巴 (巧妙融入小狗后颈) -->
  <path d="M 11 21 L 5 25 L 11 25 Z" fill="#2C4033"/>

  <!-- 极简复古红项圈 -->
  <line x1="11" y1="23" x2="22.5" y2="23" stroke="#A84C3D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 平和闭着的眼睛 (极简线条) -->
  <path d="M 20 13.5 Q 21 14.5, 22 13.5" fill="none" stroke="#EAE5D9" stroke-width="1" stroke-linecap="round"/>

  <!-- AI 大模型思考中的省略号 -->
  <circle cx="14.5" cy="19" r="0.8" fill="#EAE5D9"/>
  <circle cx="17.5" cy="19" r="0.8" fill="#EAE5D9"/>
  <circle cx="20.5" cy="19" r="0.8" fill="#EAE5D9"/>
</svg>
